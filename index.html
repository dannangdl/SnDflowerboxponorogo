<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnDflowerboxponorogo</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  background:
  linear-gradient(rgba(255,255,255,0.85),rgba(255,255,255,0.9)),
  url('https://images.unsplash.com/photo-1490750967868-88aa4486c946?q=80&w=1200');
  background-size:cover;
  background-position:center;
  min-height:100vh;
  padding:20px;
  color:#444;
}

.container{
  max-width:850px;
  margin:auto;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(10px);
  border-radius:25px;
  padding:25px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.header{
  text-align:center;
  margin-bottom:30px;
}

.logo{
  width:110px;
  height:110px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid #ffd6e0;
  margin-bottom:15px;
}

.header h1{
  font-size:2rem;
  color:#d16b86;
  margin-bottom:8px;
}

.header p{
  color:#777;
  font-size:15px;
}

form{
  display:flex;
  flex-direction:column;
  gap:20px;
}

.form-group,
.form-section{
  background:#fffafc;
  padding:18px;
  border-radius:18px;
  border:1px solid #ffe4ec;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:600;
  color:#b85d75;
}

.required::after{
  content:" *";
  color:red;
}

input,
textarea{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #f3c9d5;
  outline:none;
  font-size:15px;
  background:#fff;
  transition:0.3s;
}

input:focus,
textarea:focus{
  border-color:#d16b86;
  box-shadow:0 0 0 4px rgba(209,107,134,0.12);
}

textarea{
  min-height:120px;
  resize:vertical;
}

.example-box{
  background:#fff0f5;
  padding:14px;
  border-radius:12px;
  margin-bottom:12px;
  color:#666;
  font-size:14px;
  line-height:1.6;
}

.radio-group,
.checkbox-group,
.color-options{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-top:10px;
}

.radio-item,
.checkbox-item,
.color-option{
  display:flex;
  align-items:center;
  gap:10px;
  background:white;
  padding:12px;
  border-radius:14px;
  border:1px solid #f5d6df;
  transition:0.3s;
}

.radio-item:hover,
.checkbox-item:hover,
.color-option:hover{
  background:#fff0f5;
  transform:translateY(-2px);
}

.form-section-title{
  font-weight:700;
  color:#c45d7a;
  margin-bottom:14px;
  font-size:16px;
}

.date-time-group{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.button-group{
  display:flex;
  gap:15px;
  margin-top:10px;
}

button{
  flex:1;
  padding:15px;
  border:none;
  border-radius:16px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  transition:0.3s;
}

.btn-preview{
  background:#ffd6e0;
  color:#8a4c5d;
}

.btn-submit{
  background:linear-gradient(135deg,#ff9eb5,#ffc2d1);
  color:white;
}

button:hover{
  transform:translateY(-3px);
  opacity:0.95;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
  padding:20px;
  z-index:999;
}

.modal-content{
  background:white;
  width:100%;
  max-width:550px;
  border-radius:25px;
  padding:25px;
  max-height:90vh;
  overflow:auto;
}

.success-alert{
  position:fixed;
  top:20px;
  right:20px;
  background:#ffb6c1;
  color:white;
  padding:15px 20px;
  border-radius:15px;
  display:none;
  z-index:9999;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

/* RESPONSIVE */

@media(max-width:768px){

  body{
    padding:12px;
  }

  .container{
    padding:18px;
    border-radius:20px;
  }

  .header h1{
    font-size:1.6rem;
  }

  .date-time-group{
    grid-template-columns:1fr;
  }

  .button-group{
    flex-direction:column;
  }

  .radio-group,
  .checkbox-group,
  .color-options{
    grid-template-columns:1fr;
  }

  input,
  textarea,
  button{
    font-size:16px;
  }

}

@media(max-width:480px){

  .header h1{
    font-size:1.4rem;
  }

  .logo{
    width:90px;
    height:90px;
  }

  .form-group,
  .form-section{
    padding:15px;
  }

}

</style>
</head>

<body>

<div class="container">

  <div class="header">
    <img src="logo.png" alt="Logo" class="logo">
    <h1>SnDflowerboxponorogo</h1>
    <p>Abadikan momenmu dengan bunga terbaik 💐</p>
  </div>

  <!-- FORM -->
  <!-- Tempel isi form lama Anda di sini -->
  
</div>

</body>
</html>
